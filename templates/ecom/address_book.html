{% extends 'ecom/customer_base.html' %}{% block content %}<main class="page"><div class="checkout-grid"><div class="panel"><h2>Saved addresses</h2>{% for a in addresses %}<div class="panel" style="margin:10px 0"><b>{{a.label}}</b><p>{{a.address}}</p><p class="muted">{{a.mobile}}</p><a class="btn btn-danger" href="{% url 'delete-address' a.id %}">Delete</a></div>{% empty %}<p class="muted">No saved addresses.</p>{% endfor %}</div><div class="panel"><h2>Add address</h2><form method="post">{% csrf_token %}<input name="label" placeholder="Home / Office" style="width:100%;padding:12px;margin:6px 0"><textarea name="address" required placeholder="Full delivery address" style="width:100%;padding:12px;margin:6px 0;height:120px"></textarea><input name="mobile" required placeholder="Mobile number" style="width:100%;padding:12px;margin:6px 0"><button class="btn btn-primary">Save address</button></form></div></div></main>{% endblock %}
